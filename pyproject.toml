[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-cropping-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-cropping-claim-audit = "image_cropping_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["image_cropping_claim_audit*"]
